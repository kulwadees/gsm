<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Live</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  body { margin:0; background:#131722; color:#eee; font-family:sans-serif; }
  #bar { padding:10px 16px; display:flex; gap:20px; align-items:baseline; }
  #symbol { font-weight:bold; font-size:1.2em; }
  #price { font-size:1.4em; font-variant-numeric:tabular-nums; }
  .up { color:#26a69a; } .down { color:#ef5350; }
  #chart { height: calc(100vh - 45px); }
</style>
</head>
<body>
<div id="bar">
  <span id="symbol">--</span>
  <span id="price">--</span>
</div>
<div id="chart"></div>

<script>
// ⭐ แก้ URL ตรงนี้: local ทดสอบ หรือ URL จาก deploy/tunnel
//const API_URL = "http://localhost:5000";
//const API_URL = "https://gsm-938z.onrender.com/";
const API_URL = "";
  fetch('/api/config')
    .then(r => r.json())
    .then(cfg => {
      document.getElementById('symbol').textContent =
        cfg.instrument.replace('_', '/');
    });
const chart = LightweightCharts.createChart(
  document.getElementById("chart"),
  { layout: { background:{type:"solid", color:"#131722"}, textColor:"#aaa",
              upColor:"#26a69a", downColor:"#ef5350" },
    grid: { vertLines:{color:"#1e222d"}, horzLines:{color:"#1e222d"} },
    timeScale:{ timeVisible:true, secondsVisible:false } });

const candleSeries = chart.addCandlestickSeries({
  upColor:"#26a69a", downColor:"#ef5350", borderVisible:false,
  wickUpColor:"#26a69a", wickDownColor:"#ef5350" });

function resize() {
  chart.applyOptions({ width: window.innerWidth,
                       height: window.innerHeight - 45 });
}
// โหลดประวัติเก่า (มีระบบลองใหม่ถ้าเจอ 503 กำลังเตรียมข้อมูล)
function loadHistory() {
  fetch(`${API_URL}/api/history`)
    .then(async r => {
      if (r.status === 503) {
        console.log("Server กำลังเตรียมข้อมูลประวัติ, จะลองใหม่ใน 3 วินาที...");
        setTimeout(loadHistory, 3000);
        return null;
      }
      return r.json();
    })
    .then(d => {
      if (!d || !d.candles) return;
      candleSeries.setData(d.candles.map(c => ({
        time: c.time, open: c.open, high: c.high,
        low: c.low, close: c.close
      })));
      console.log("โหลดประวัติสำเร็จ:", d.candles.length, "แท่ง");
    })
    .catch(e => {
      console.error("โหลด history ไม่ได้, ลองใหม่ใน 3 วินาที:", e);
      setTimeout(loadHistory, 3000);
    });
}

// เริ่มเรียกใช้งาน
loadHistory();
window.addEventListener("resize", resize);
resize();

// โหลดประวัติเก่าก่อน
fetch(`${API_URL}/api/history`)
  .then(r => r.json())
  .then(d => {
    candleSeries.setData(d.candles.map(c => ({
      time: c.time, open: c.open, high: c.high,
      low: c.low, close: c.close })));
  })
  .catch(e => console.error("โหลด history ไม่ได้:", e));

// รับ candle สดจาก server ทุก tick
let lastClose = null;
//const socket = io(API_URL, { transports:["websocket"] });
const socket = io();
socket.on("candle", c => {
  candleSeries.update({
    time: c.time, open: c.open, high: c.high,
    low: c.low, close: c.close });

  const el = document.getElementById("price");
  el.textContent = c.close.toFixed(2);
  if (lastClose !== null) {
    el.className = c.close >= lastClose ? "up" : "down";
  }
  lastClose = c.close;
});
</script>
</body>
</html>
